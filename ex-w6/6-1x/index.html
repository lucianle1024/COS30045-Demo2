<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive D3 Chart</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/visualisation.css">
</head>
<body>
    <header>
        <h1>TV Energy Consumption</h1>
    </header>
    <main>
        <div>
            <h1>Energy Consumption for different TV screen types and sizes</h1>
            <p>TV's vary considerably in energy consumption.</p>
        </div>

        <!-- Filter buttons -->
        <div id="filters_screen"></div>

        <!-- div for chart -->
        <div id="histogram" class="responsive-svg-container"></div>

        <div>
            <h1>TV Energy Consumption and Star Rating</h1>
            <p>Star ratings generally correspond to energy efficiency.</p>
        </div>

        <!-- Scatterplot container -->
        <div id="scatterplot" class="responsive-svg-container"></div>

        <div class="body">
            <h3>Data source</h3>
            <p>
                <a href="https://data.gov.au/data/dataset/energy-rating-for-household-appliances" target="_blank" rel="noopener noreferrer">
                    Energy Rating Data for household appliances – Televisions
                </a><br>
            </p>
        </div>
    </main>

    <!-- D3 Library (CDN with local fallback) -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script>window.d3 || document.write('<script src="../../lib/d3.v7.min.js"><\/script>')</script>

    <script src="js/shared-constants.js"></script>
    <script src="js/interactions.js"></script>
    <script src="js/histogram.js"></script>
    <script src="js/scatterplot.js"></script>
    <script src="js/load-data.js"></script>
</body>
</html>
